<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <div class="header-left">
            <button class="pulse-icon-btn" aria-label="Status Indicator">
                <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </button>
        </div>
        <h1 class="header-title">SIGINT OPS</h1>

        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="status-text">SECURE • ONLINE</span>
            </div>
        </div>
        
    </header>

    <main class="main-content">
        <section class="radar-card">
            <div class='radar'>
                <div class='sweep'></div>
            </div>
           
            <div class="metrics-container">
            <div class="metric-item">
                <span class="metric-number">24</span>
                <span class="metric-label">ACTIVE SIGNALS</span>
            </div>
            <div class="metric-item">
                <span class="metric-number">07</span>
                <span class="metric-label">PRIORITY ALERTS</span>
            </div>
        </div>
        </section>
    </main>
    
</body>
</html>
